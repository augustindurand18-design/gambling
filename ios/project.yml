name: Gage

options:
  bundleIdPrefix: com.augustindurand
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # Aucun compte Apple Developer pour l'instant. On signe quand meme, en
    # ad-hoc local ("-") : sans signature, le trousseau refuse d'ecrire et
    # la session Supabase ne survit pas au premier appel — l'utilisateur
    # semble connecte, puis toute requete repart en anonyme.
    # L'ad-hoc ne demande ni compte ni equipe et suffit au simulateur.
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: "-"

configs:
  Debug: debug
  Release: release

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.20.0"
  StripePaymentSheet:
    url: https://github.com/stripe/stripe-ios
    from: "24.0.0"
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "8.40.0"
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftSDK
    from: "2.5.0"

targets:
  Gage:
    type: application
    platform: iOS
    sources:
      - path: Gage
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    # Info.plist genere par XcodeGen, et non par GENERATE_INFOPLIST_FILE :
    # le mecanisme INFOPLIST_KEY_<nom> ne fonctionne que pour les cles
    # qu'Xcode connait. Les cles maison Gage* etaient silencieusement
    # ignorees, et l'application ne pouvait pas lire sa propre configuration
    # — sans que rien ne le signale, puisque aucune requete reseau n'etait
    # encore emise.
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Gage
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # La camera est le seul acces media : pas d'entree photothèque, par conception.
        NSCameraUsageDescription: "Gage utilise l'appareil photo pour capturer la preuve de tes objectifs. Les photos sont prises uniquement dans l'application."
        NSLocationWhenInUseUsageDescription: "La position sert uniquement a verifier que tu es bien au lieu que tu as choisi pour ton objectif."
        # Valeurs injectees depuis Config/Secrets.xcconfig
        GageSupabaseURL: $(SUPABASE_URL)
        GageSupabaseAnonKey: $(SUPABASE_ANON_KEY)
        GageStripePublishableKey: $(STRIPE_PUBLISHABLE_KEY)
        GagePaymentManagementURL: $(PAYMENT_MANAGEMENT_URL)
        GageSentryDSN: $(SENTRY_DSN)
        GageTelemetryDeckAppID: $(TELEMETRYDECK_APP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.augustindurand.gage
        PRODUCT_NAME: Gage
    # Entitlements desactives tant qu'il n'y a pas de compte Apple Developer :
    # aps-environment, Sign in with Apple et Apple Pay exigent un profil de
    # provisioning. Les activer avant que le compte ne fonctionne casserait la
    # compilation sur appareil pour tout le monde, y compris pour ceux dont la
    # signature marche : le profil doit d'abord contenir l'identifiant marchand.
    #
    # Le jour ou le compte marche, dans l'ordre : creer l'identifiant marchand
    # `merchant.com.augustindurand.gage` sur developer.apple.com, l'associer au
    # compte Stripe, puis decommenter la ligne ci-dessous.
    #
    #   entitlements:
    #     path: Gage/Gage.entitlements
    #
    # Le simulateur n'a besoin d'aucune signature. A reactiver le jour de
    # l'inscription au programme (voir Gage.entitlements, deja pret).
    dependencies:
      - package: Supabase
        product: Supabase
      - package: StripePaymentSheet
        product: StripePaymentSheet
      # `STPAPIClient`, ou se pose la cle publiable, vit dans StripePayments.
      # StripeCore, qui porte l'equivalent moderne, n'est PAS un produit
      # publie par stripe-ios — seulement une cible interne : le declarer ici
      # fait echouer la resolution des paquets.
      - package: StripePaymentSheet
        product: StripePayments
      - package: Sentry
        product: Sentry
      - package: TelemetryDeck
        product: TelemetryDeck

  GageTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GageTests
    dependencies:
      - target: Gage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.augustindurand.gage.tests
        GENERATE_INFOPLIST_FILE: YES

  GageUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GageUITests
    dependencies:
      - target: Gage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.augustindurand.gage.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Gage:
    build:
      targets:
        Gage: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - GageTests
        - GageUITests
    archive:
      config: Release
