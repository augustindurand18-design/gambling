<!doctype html>
<html lang="fr">
  <body style="margin:0;padding:24px;background:#f6f7f9;font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;color:#141b3c">
    <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:16px;padding:32px">
      <h1 style="margin:0 0 16px;font-size:20px">Ton code de connexion</h1>

      <p style="margin:0 0 24px;font-size:15px;line-height:1.5">
        Voici le code à saisir dans l'application :
      </p>

      <p style="margin:0 0 24px;font-size:32px;font-weight:700;letter-spacing:8px;color:#4630d8">{{ .Token }}</p>

      <p style="margin:0 0 24px;font-size:15px;line-height:1.5">
        Il expire dans une heure et ne sert qu'une fois.
      </p>

      <p style="margin:0;font-size:13px;line-height:1.5;color:#6b7280">
        Si tu n'as pas demandé ce code, ignore ce message : personne ne peut
        accéder à ton compte sans lui.
      </p>
    </div>
  </body>
</html>
